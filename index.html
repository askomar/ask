<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskOmar.agency</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}

.hero{
  min-height:100svh;
  width:100%;
  background:#050505;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:10px 12px 22px;
}


.photo-wrap{
  position:relative;
  width:100%;
  line-height:0;
}

.photo-button-link{
  position:absolute;
  left:5%;
  top:52%;
  width:77%;
  height:11%;
  z-index:5;
  display:block;
  cursor:pointer;
  border-radius:50px;
  background:transparent;
}

.photo{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}

.logo{
  width:120px;
  max-width:120px;
  height:auto;
  display:block;
  margin:0 auto;
  animation:logoDefile 4s ease-in-out infinite;
  flex-shrink:0;
}

.cta{
  display:block;
  width:100%;
  max-width:520px;
  margin-top:14px;
  padding:18px 20px;
  border:2px solid #f5c542;
  border-radius:50px;
  background:linear-gradient(135deg,#ffe27a,#eeb21c);
  color:#000;
  text-align:center;
  text-decoration:none;
  font-size:18px;
  font-weight:800;
  box-shadow:0 5px 25px rgba(245,197,66,.25);
}

.formulaire{
  display:none;
  min-height:100vh;
  background:#080808;
  padding:35px 15px;
}

.formulaire:target{display:block}

.box{
  max-width:600px;
  margin:auto;
  padding:25px 20px;
  background:#111;
  border:1px solid #333;
  border-radius:22px;
}

h1{font-size:28px;margin-bottom:10px}
h1 span{color:#f5c542}
.description{color:#aaa;line-height:1.5;margin-bottom:20px}

label{display:block;margin:16px 0 7px;font-weight:bold}

input,textarea,select{
  width:100%;
  padding:14px;
  background:#1b1b1b;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  font-size:16px;
}

textarea{min-height:130px;resize:vertical}

.send{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:40px;
  background:#f5c542;
  color:#000;
  font-size:18px;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#aaa;
  text-decoration:none;
}


@keyframes logoDefile{
  0%{transform:translateX(-55px);opacity:0}
  20%{transform:translateX(0);opacity:1}
  50%{transform:translateX(0);opacity:1}
  80%{transform:translateX(0);opacity:1}
  100%{transform:translateX(55px);opacity:0}
}

@media(max-width:600px){
  .hero{padding-bottom:18px}
  .logo{
    width:110px;
    max-width:110px;
    animation:logoDefile 4s ease-in-out infinite;
  }
  .cta{font-size:17px;padding:17px}
}
</style>
</head>

<section id="formulaire" class="formulaire">

  <div class="box">

    <h1>
      Décris-moi <span>ton problème.</span>
    </h1>

    <p class="description">
      Un premier échange simple pour comprendre ta situation
      et voir comment je peux t'aider.
    </p>

    <form onsubmit="envoyer(event)">

      <label>Ton prénom</label>
      <input id="prenom" type="text" placeholder="Ton prénom" required>

      <label>Ton email</label>
      <input id="email" type="email" placeholder="ton@email.com" required>

      <label>Ton numéro WhatsApp</label>
      <input id="whatsapp" type="tel" placeholder="+212 6 XX XX XX XX" required>

      <label>Quel est ton problème ?</label>
      <textarea id="probleme" placeholder="Décris ton problème..." required></textarea>

      <label>Ton budget</label>
      <select id="budget">
        <option value="">Sélectionne</option>
        <option>Je ne sais pas encore</option>
        <option>Moins de 500 €</option>
        <option>500 € – 1 000 €</option>
        <option>1 000 € – 3 000 €</option>
        <option>Plus de 3 000 €</option>
      </select>

      <button class="send" type="submit">
        Envoyer mon problème →
      </button>

    </form>

    <a class="back" href="#">← Retour</a>

  </div>

</section>


<script>
function ouvrirFormulaire(event){
  if(event) event.preventDefault();

  const formulaire = document.getElementById("formulaire");

  if(formulaire){
    formulaire.style.display = "block";
    setTimeout(function(){
      formulaire.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    },50);
  }
}

function envoyer(e){
  e.preventDefault();
  const prenom=document.getElementById("prenom").value;
  alert("Merci "+prenom+" !\n\nTon problème a bien été préparé.");
}
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("a, button").forEach(function (el) {
    if (el.textContent.includes("Soumettre mon problème")) {
      el.addEventListener("click", function () {
        var form = document.getElementById("formulaire");
        if (form) {
          form.style.display = "block";
          setTimeout(function () {
            form.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 50);
        }
      });
    }
  });
});
</script>
